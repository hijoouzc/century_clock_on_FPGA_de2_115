<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 780" width="1500" height="780" style="background-color:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Top Boundary -->
  <rect x="160" y="35" width="1150" height="685" fill="#fafafa" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="175" y="60" font-size="13" font-weight="bold" fill="#000000">century_clock_top</text>
  <text x="305" y="60" font-size="10" fill="#555555">(DE2-115 Top-Level Entity)</text>

  <!-- External Inputs -->
  <rect x="25" y="95" width="95" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="72" y="112" font-size="10" font-weight="bold" text-anchor="middle">CLOCK_50</text>
  <text x="72" y="124" font-size="8" text-anchor="middle" fill="#444">50 MHz (PIN_Y2)</text>

  <rect x="25" y="155" width="95" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="72" y="172" font-size="10" font-weight="bold" text-anchor="middle">KEY[3]</text>
  <text x="72" y="184" font-size="8" text-anchor="middle" fill="#444">rst_n (PIN_R24)</text>

  <rect x="25" y="365" width="95" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="72" y="385" font-size="10" font-weight="bold" text-anchor="middle">KEY[2:0]</text>
  <text x="72" y="398" font-size="8" text-anchor="middle" fill="#444">Pushbuttons</text>

  <rect x="25" y="600" width="95" height="45" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="72" y="620" font-size="10" font-weight="bold" text-anchor="middle">SW[1:0]</text>
  <text x="72" y="633" font-size="8" text-anchor="middle" fill="#444">Slide Switches</text>

  <!-- Module 1: clk_div -->
  <rect x="190" y="80" width="170" height="130" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="275" y="105" font-size="12" font-weight="bold" text-anchor="middle">clk_div</text>
  <line x1="200" y1="112" x2="350" y2="112" stroke="#000000" stroke-width="0.8" />
  <text x="275" y="130" font-size="9" font-weight="bold" text-anchor="middle">50 MHz Prescaler</text>
  <text x="275" y="150" font-size="9" text-anchor="middle">• 1s Tick Generator</text>
  <text x="275" y="170" font-size="9" text-anchor="middle">• 2Hz Blink Generator</text>

  <!-- Module 2: button_filter -->
  <rect x="190" y="310" width="170" height="160" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="275" y="335" font-size="12" font-weight="bold" text-anchor="middle">button_filter (x3)</text>
  <line x1="200" y1="342" x2="350" y2="342" stroke="#000000" stroke-width="0.8" />
  <text x="275" y="360" font-size="9" font-weight="bold" text-anchor="middle">Debounce &amp; Pulse</text>
  <text x="275" y="380" font-size="9" text-anchor="middle">• Invert Active-Low</text>
  <text x="275" y="400" font-size="9" text-anchor="middle">• 2-Stage D-FF Sync</text>
  <text x="275" y="420" font-size="9" text-anchor="middle">• 20ms Glitch Filter</text>
  <text x="275" y="440" font-size="9" text-anchor="middle">• 1-Cycle Pulse Detect</text>

  <!-- Module 3: clock_core -->
  <rect x="460" y="80" width="240" height="580" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="580" y="105" font-size="13" font-weight="bold" text-anchor="middle">clock_core</text>
  <line x1="475" y1="115" x2="685" y2="115" stroke="#000000" stroke-width="0.8" />
  <text x="580" y="140" font-size="10" font-weight="bold" text-anchor="middle">[ FSM Controller ]</text>
  <text x="580" y="160" font-size="9" text-anchor="middle">S_RUN | S_SET_HOUR | S_SET_MIN</text>
  <text x="580" y="175" font-size="9" text-anchor="middle">S_SET_SEC | S_SET_DAY | S_SET_MONTH | S_SET_YEAR</text>

  <line x1="475" y1="195" x2="685" y2="195" stroke="#000000" stroke-width="0.5" stroke-dasharray="3,3" />
  <text x="580" y="220" font-size="10" font-weight="bold" text-anchor="middle">[ Synchronous RTC Counters ]</text>
  <text x="500" y="245" font-size="9">• sec [5:0] (0..59)</text>
  <text x="605" y="245" font-size="9">• day [4:0] (1..max_day)</text>
  <text x="500" y="270" font-size="9">• min [5:0] (0..59)</text>
  <text x="605" y="270" font-size="9">• month [3:0] (1..12)</text>
  <text x="500" y="295" font-size="9">• hour [4:0] (0..23)</text>
  <text x="605" y="295" font-size="9">• year [13:0] (0..9999)</text>

  <line x1="475" y1="320" x2="685" y2="320" stroke="#000000" stroke-width="0.5" stroke-dasharray="3,3" />
  <text x="580" y="345" font-size="10" font-weight="bold" text-anchor="middle">[ Century Calendar Logic ]</text>
  <text x="580" y="370" font-size="9" text-anchor="middle">• Leap Year Logic:</text>
  <text x="580" y="385" font-size="8.5" text-anchor="middle" fill="#222">((Y%4==0 &amp;&amp; Y%100!=0) || Y%400==0)</text>
  <text x="580" y="410" font-size="9" text-anchor="middle">• Dynamic max_day (28/29/30/31)</text>
  <text x="580" y="430" font-size="9" text-anchor="middle">• Auto-Clamp Day: day &lt;= max_day</text>

  <!-- Module 4: display_controller -->
  <rect x="800" y="80" width="230" height="580" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="915" y="105" font-size="13" font-weight="bold" text-anchor="middle">display_controller</text>
  <line x1="815" y1="115" x2="1015" y2="115" stroke="#000000" stroke-width="0.8" />
  <text x="915" y="140" font-size="10" font-weight="bold" text-anchor="middle">[ BCD Decomposition ]</text>
  <text x="915" y="165" font-size="9" text-anchor="middle">Tens = Value / 10</text>
  <text x="915" y="185" font-size="9" text-anchor="middle">Ones = Value % 10</text>

  <line x1="815" y1="210" x2="1015" y2="210" stroke="#000000" stroke-width="0.5" stroke-dasharray="3,3" />
  <text x="915" y="235" font-size="10" font-weight="bold" text-anchor="middle">[ Display Multiplexer ]</text>
  <text x="915" y="260" font-size="9" text-anchor="middle">• SW[1]=0: Time Mode</text>
  <text x="915" y="275" font-size="8.5" text-anchor="middle" fill="#444">(HH : MM : SS : --)</text>
  <text x="915" y="300" font-size="9" text-anchor="middle">• SW[1]=1: Date Mode</text>
  <text x="915" y="315" font-size="8.5" text-anchor="middle" fill="#444">(DD : MM : YYYY)</text>

  <line x1="815" y1="340" x2="1015" y2="340" stroke="#000000" stroke-width="0.5" stroke-dasharray="3,3" />
  <text x="915" y="365" font-size="10" font-weight="bold" text-anchor="middle">[ Blinking / Blanking Logic ]</text>
  <text x="915" y="390" font-size="9" text-anchor="middle">• If SET Mode (SW[0]=1) &amp; !blink:</text>
  <text x="915" y="410" font-size="9" text-anchor="middle">Mask active field with 4&apos;hF (Blank/OFF)</text>

  <!-- Module 5: seg7_decoder -->
  <rect x="1110" y="270" width="160" height="190" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="1190" y="295" font-size="12" font-weight="bold" text-anchor="middle">seg7_decoder (x8)</text>
  <line x1="1125" y1="305" x2="1255" y2="305" stroke="#000000" stroke-width="0.8" />
  <text x="1190" y="325" font-size="9" font-weight="bold" text-anchor="middle">u_hex7 .. u_hex0</text>
  <text x="1190" y="350" font-size="9" text-anchor="middle">4-bit BCD to 7-Segment</text>
  <text x="1190" y="370" font-size="9" text-anchor="middle">Active-Low Truth Table</text>
  <text x="1190" y="390" font-size="9" text-anchor="middle">(0: ON, 1: OFF)</text>
  <text x="1190" y="420" font-size="9" text-anchor="middle">4&apos;hF: All Segments OFF</text>

  <!-- External Output -->
  <rect x="1350" y="305" width="110" height="120" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="1405" y="335" font-size="11" font-weight="bold" text-anchor="middle">8x 7-Segment</text>
  <text x="1405" y="355" font-size="9" text-anchor="middle">HEX7 .. HEX0</text>
  <text x="1405" y="375" font-size="9" text-anchor="middle">Displays</text>
  <text x="1405" y="395" font-size="8" text-anchor="middle" fill="#444">(Altera DE2-115)</text>

  <!-- Wire: CLOCK_50 -->
  <line x1="120" y1="113" x2="190" y2="113" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="155" y="107" font-size="9" font-weight="bold" text-anchor="middle">CLOCK_50</text>

  <!-- Wire: KEY[3] -->
  <line x1="120" y1="173" x2="190" y2="173" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="155" y="167" font-size="9" font-weight="bold" text-anchor="middle">rst_n</text>

  <!-- Wire: KEY[2:0] (Bus) -->
  <line x1="120" y1="388" x2="190" y2="388" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="155" y="380" font-size="9" font-weight="bold" text-anchor="middle">KEY[2:0]</text>
  <line x1="151" y1="394" x2="159" y2="382" stroke="#000000" stroke-width="2" />
  <text x="155" y="372" font-size="8" font-weight="bold" text-anchor="middle">3</text>

  <!-- Wire: tick_1s -->
  <line x1="360" y1="130" x2="460" y2="130" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="410" y="123" font-size="9" font-weight="bold" text-anchor="middle">tick_1s</text>

  <!-- Wire: blink (2Hz) Top Channel -->
  <path d="M 360 185 L 410 185 L 410 55 L 760 55 L 760 110 L 800 110" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="550" y="47" width="70" height="16" fill="#ffffff" />
  <text x="585" y="59" font-size="9" font-weight="bold" text-anchor="middle">blink (2Hz)</text>

  <!-- Wires: key pulses -->
  <line x1="360" y1="345" x2="460" y2="345" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="410" y="338" font-size="9" font-weight="bold" text-anchor="middle">key_change</text>

  <line x1="360" y1="390" x2="460" y2="390" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="410" y="383" font-size="9" font-weight="bold" text-anchor="middle">key_up</text>

  <line x1="360" y1="435" x2="460" y2="435" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="410" y="428" font-size="9" font-weight="bold" text-anchor="middle">key_down</text>

  <!-- Wires: SW[1:0] Bottom Channel -->
  <line x1="120" y1="622" x2="460" y2="622" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="290" y="615" font-size="9" font-weight="bold" text-anchor="middle">SW[1:0]</text>
  <line x1="286" y1="628" x2="294" y2="616" stroke="#000000" stroke-width="2" />
  <text x="290" y="607" font-size="8" font-weight="bold" text-anchor="middle">2</text>

  <line x1="460" y1="622" x2="800" y2="622" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="750" y="615" font-size="9" font-weight="bold" text-anchor="middle">SW[1:0]</text>
  <line x1="746" y1="628" x2="754" y2="616" stroke="#000000" stroke-width="2" />
  <text x="750" y="607" font-size="8" font-weight="bold" text-anchor="middle">2</text>

  <!-- 7 Straight Horizontal Data Buses -->
  <!-- 1. state [2:0] -->
  <line x1="700" y1="150" x2="800" y2="150" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="750" y="142" font-size="9.5" font-weight="bold" text-anchor="middle">state [2:0]</text>
  <line x1="746" y1="156" x2="754" y2="144" stroke="#000000" stroke-width="2" />
  <text x="750" y="133" font-size="8" font-weight="bold" text-anchor="middle">3</text>

  <!-- 2. sec [5:0] -->
  <line x1="700" y1="220" x2="800" y2="220" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="750" y="212" font-size="9.5" font-weight="bold" text-anchor="middle">sec [5:0]</text>
  <line x1="746" y1="226" x2="754" y2="214" stroke="#000000" stroke-width="2" />
  <text x="750" y="203" font-size="8" font-weight="bold" text-anchor="middle">6</text>

  <!-- 3. min [5:0] -->
  <line x1="700" y1="290" x2="800" y2="290" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="750" y="282" font-size="9.5" font-weight="bold" text-anchor="middle">min [5:0]</text>
  <line x1="746" y1="296" x2="754" y2="284" stroke="#000000" stroke-width="2" />
  <text x="750" y="273" font-size="8" font-weight="bold" text-anchor="middle">6</text>

  <!-- 4. hour [4:0] -->
  <line x1="700" y1="360" x2="800" y2="360" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="750" y="352" font-size="9.5" font-weight="bold" text-anchor="middle">hour [4:0]</text>
  <line x1="746" y1="366" x2="754" y2="354" stroke="#000000" stroke-width="2" />
  <text x="750" y="343" font-size="8" font-weight="bold" text-anchor="middle">5</text>

  <!-- 5. day [4:0] -->
  <line x1="700" y1="430" x2="800" y2="430" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="750" y="422" font-size="9.5" font-weight="bold" text-anchor="middle">day [4:0]</text>
  <line x1="746" y1="436" x2="754" y2="424" stroke="#000000" stroke-width="2" />
  <text x="750" y="413" font-size="8" font-weight="bold" text-anchor="middle">5</text>

  <!-- 6. month [3:0] -->
  <line x1="700" y1="500" x2="800" y2="500" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="750" y="492" font-size="9.5" font-weight="bold" text-anchor="middle">month [3:0]</text>
  <line x1="746" y1="506" x2="754" y2="494" stroke="#000000" stroke-width="2" />
  <text x="750" y="483" font-size="8" font-weight="bold" text-anchor="middle">4</text>

  <!-- 7. year [13:0] -->
  <line x1="700" y1="570" x2="800" y2="570" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="750" y="562" font-size="9.5" font-weight="bold" text-anchor="middle">year [13:0]</text>
  <line x1="746" y1="576" x2="754" y2="564" stroke="#000000" stroke-width="2" />
  <text x="750" y="553" font-size="8" font-weight="bold" text-anchor="middle">14</text>

  <!-- Display -> Decoders -->
  <line x1="1030" y1="365" x2="1110" y2="365" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="1070" y="356" font-size="9.5" font-weight="bold" text-anchor="middle">d7..d0 [3:0]</text>
  <line x1="1066" y1="371" x2="1074" y2="359" stroke="#000000" stroke-width="2" />
  <text x="1070" y="347" font-size="8" font-weight="bold" text-anchor="middle">4(x8)</text>

  <!-- Decoders -> External Displays -->
  <line x1="1270" y1="365" x2="1350" y2="365" stroke="#000000" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="1310" y="356" font-size="9.5" font-weight="bold" text-anchor="middle">HEX7..0 [6:0]</text>
  <line x1="1306" y1="371" x2="1314" y2="359" stroke="#000000" stroke-width="2" />
  <text x="1310" y="347" font-size="8" font-weight="bold" text-anchor="middle">7(x8)</text>

</svg>